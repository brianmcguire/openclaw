name: Isolated macOS PATH behavior proof
on:
  push:
    branches: [proof/macos-exec-path-171460]
permissions:
  contents: read
jobs:
  app-proof:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: proof-runner
      - uses: actions/checkout@v4
        with:
          repository: brianmcguire/openclaw
          ref: 564e4b3f47709783ad44cf3742f889c105da86fb
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Prepare pinned package manager and toolchain
        working-directory: source
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "$(node -p 'require("./package.json").packageManager')" --activate
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          require_swift_toolchain
          test "$(git rev-parse HEAD)" = 564e4b3f47709783ad44cf3742f889c105da86fb
          mkdir -p ../proof-results
          sw_vers > ../proof-results/platform.txt
          swift --version >> ../proof-results/platform.txt
      - name: Package candidate app from the reviewed commit
        working-directory: source
        env:
          BUNDLE_ID: ai.openclaw.mac
          BUILD_CONFIG: debug
          BUILD_ARCHS: arm64
          ALLOW_ADHOC_SIGNING: '1'
          OPENCLAW_SKIP_MLX_TTS: '1'
          CODESIGN_TIMESTAMP: 'off'
        run: |
          set -euo pipefail
          # Match the Apple Git environment where this exact verifier passes locally.
          mkdir -p ../proof-tools
          ln -s /usr/bin/git ../proof-tools/git
          export PATH="$PWD/../proof-tools:$PATH"
          git --version | tee ../proof-results/git-version.txt
          python3 - <<'PY' 2>&1 | tee ../proof-results/git-preflight.log
          import os, signal, subprocess
          command = '''set -euo pipefail
          ROOT_DIR="$PWD"
          SWIFT_PACKAGE_ROOT="$PWD/apps/macos"
          source scripts/lib/mac-swift-build.sh
          run_with_locked_swift_packages swift package --package-path apps/macos --scratch-path apps/macos/.build/arm64 resolve --force-resolved-versions
          compiled_peekaboo_commit apps/macos/.build/arm64/checkouts/Peekaboo e060b6ba21792b327ce2a10368f57c8e569dc712
          '''
          process = subprocess.Popen(['/bin/bash', '-c', command], start_new_session=True)
          try:
              status = process.wait(timeout=300)
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGKILL)
              process.wait()
              raise SystemExit('Source-integrity preflight exceeded five minutes; packaging not started')
          raise SystemExit(status)
          PY
          # This credentialless job traces build substeps, never the later auth proof.
          task_trace_file="$RUNNER_TEMP/openclaw-build-trace.sh"
          printf '%s\n' 'set -x' > "$task_trace_file"
          BASH_ENV="$task_trace_file" /bin/bash scripts/package-mac-app.sh 2>&1 | tee ../proof-results/package.log
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent dist/OpenClaw.app ../macos-path-candidate.zip
      - name: Retain candidate bundle for proof recovery
        uses: actions/upload-artifact@v4
        with:
          name: macos-path-candidate-564e4b3f
          path: macos-path-candidate.zip
          retention-days: 3
      - name: Exercise stable and candidate native app execution
        run: python3 proof-runner/proof/native_app.py source/dist/OpenClaw.app proof-results
      - name: Upload scoped proof and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-path-proof-171460
          path: proof-results/
          retention-days: 14
